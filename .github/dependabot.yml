version: 2
updates:
  # npm dependencies of the package and the example host
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/example'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
      - 'automated'
    groups:
      # Minor and patch updates land together; major updates get their own PRs.
      npm-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
      # ESLint and its shared config move majors together.
      eslint-major:
        patterns:
          - 'eslint'
          - 'eslint-config-universe'
        update-types:
          - 'major'
    ignore:
      # The Expo SDK pins these together; upgrade them with `npx expo install expo@^<next> --fix`.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@types/react'
      - dependency-name: 'babel-preset-expo'
      - dependency-name: 'jest-expo'
      - dependency-name: 'jest'
      - dependency-name: '@types/jest'
      - dependency-name: 'typescript'
      # babel-preset-expo targets Babel 7.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
      # Matches the Node.js support floor (22.13); raise it with the floor.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'ci'
      - 'automated'
    groups:
      github-actions:
        patterns:
          - '*'
