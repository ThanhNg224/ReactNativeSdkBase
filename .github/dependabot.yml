version: 2
updates:
  # npm dependencies of the package and the example host
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/example'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
      - 'automated'
    groups:
      npm-dependencies:
        patterns:
          - '*'
    ignore:
      # The Expo SDK pins these together; upgrade them with `npx expo install expo@^<next> --fix`.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@types/react'
      - dependency-name: 'babel-preset-expo'
      - dependency-name: 'jest-expo'
      - dependency-name: 'jest'
      - dependency-name: '@types/jest'
      - dependency-name: 'typescript'

  # GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'ci'
      - 'automated'
    groups:
      github-actions:
        patterns:
          - '*'
