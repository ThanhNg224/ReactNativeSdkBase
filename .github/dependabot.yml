version: 2
updates:
  # npm dependencies of the package and the example host
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/example'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
      - 'automated'
    groups:
      npm-dependencies:
        patterns:
          - '*'
    ignore:
      # Expo SDK, React Native, and React move together; upgrade them deliberately.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  # GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'ci'
      - 'automated'
    groups:
      github-actions:
        patterns:
          - '*'
