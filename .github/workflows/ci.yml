name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', 'lts/*']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npm run ci

  packaged-android:
    name: Packaged Android example (Expo ${{ matrix.expo }})
    runs-on: ubuntu-latest
    needs: package
    strategy:
      fail-fast: false
      matrix:
        expo: [floor, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: npm run packaged-example -- --platform android --expo ${{ matrix.expo }}

  packaged-ios:
    name: Packaged iOS example (Expo ${{ matrix.expo }})
    runs-on: macos-latest
    needs: package
    strategy:
      fail-fast: false
      matrix:
        expo: [floor, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - run: npm run packaged-example -- --platform ios --expo ${{ matrix.expo }}
